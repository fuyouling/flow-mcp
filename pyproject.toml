[project]
name = "flow-mcp"
version = "1.0.0"
description = "Google Flow MCP — Cluster-Native Media Generation Service"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9,<2.0",
    "DrissionPage>=4.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "markdownify>=0.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "grpcio>=1.64",
    "grpcio-tools>=1.64",
    "protobuf>=5.27",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
flow-mcp = "flow_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flow_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
